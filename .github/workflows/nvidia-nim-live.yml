name: NVIDIA NIM Live Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reasoning-effort:
    name: Reasoning effort (${{ matrix.effort }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        effort: [low, high]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify NVIDIA NIM reasoning effort
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENWIKI_PROVIDER: nvidia
          OPENWIKI_MODEL_ID: nvidia/nemotron-3-super-120b-a12b
          OPENWIKI_REASONING_EFFORT: ${{ matrix.effort }}
        run: |
          test -n "$NVIDIA_API_KEY"
          expected="NIM_${OPENWIKI_REASONING_EFFORT^^}_OK"
          response="$(pnpm exec tsx src/cli/cli.tsx --print --mode code --model-id "$OPENWIKI_MODEL_ID" "Reply with exactly $expected. Do not call tools and do not modify files.")"
          printf '%s\n' "$response"
          test "$response" = "$expected"
