name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    # Scheduled runs only fire in the origin repo by default, so contributor
    # forks do not silently arm a daily job that requires a provider secret.
    # Fork owners can opt in without editing this file by setting the
    # OPENWIKI_ENABLE_SCHEDULED_UPDATE repository variable to "true". Manual
    # dispatch remains available for intentional runs and testing.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'langchain-ai/openwiki' || vars.OPENWIKI_ENABLE_SCHEDULED_UPDATE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Enable Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenWiki from the checked-out source
        run: pnpm build

      - name: Run OpenWiki
        id: openwiki
        continue-on-error: true
        # Dogfood main rather than the latest published release so this daily
        # run exercises unreleased agent, middleware, and output-format changes.
        run: node dist/cli/cli.js code --update --print
        env:
          OPENWIKI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: z-ai/glm-5.2
          # To run with GitHub Copilot instead of OpenRouter, set the
          # COPILOT_API_KEY repository secret (a GitHub OAuth token) and use:
          # OPENWIKI_PROVIDER: copilot
          # OPENWIKI_MODEL_ID: claude-sonnet-5
          # COPILOT_API_KEY: ${{ secrets.COPILOT_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: "true"

      - name: Restore protected workflow file
        # `openwiki code --update` regenerates this file from its internal
        # template on every run, which silently drops the guard above (see
        # https://github.com/langchain-ai/openwiki/issues/423). Until that's
        # fixed upstream, discard whatever the agent just wrote here so the
        # guard always survives, regardless of whether the run above
        # succeeded or failed.
        if: ${{ !cancelled() }}
        run: git checkout -- .github/workflows/openwiki-update.yml

      - name: Remove transient OpenWiki run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Create OpenWiki update pull request
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            OpenWiki result: ${{ steps.openwiki.outcome }}

            When the result is `failure`, this PR intentionally preserves only the
            pages completed before the failure. Merge it to make that progress the
            baseline for the next scheduled run.

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
