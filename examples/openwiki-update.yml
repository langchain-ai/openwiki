name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update OpenWiki
        uses: langchain-ai/openwiki@<release-tag>
        with:
          provider: openrouter
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model-id: z-ai/glm-5.2
          langsmith-api-key: ${{ secrets.LANGSMITH_API_KEY }}
          langchain-project: openwiki
          langchain-tracing-v2: "true"
