name: OpenWiki

description: Update a repository's OpenWiki and open a pull request with the changes.
author: LangChain

branding:
  color: blue
  icon: book-open

inputs:
  provider:
    description: OpenWiki model provider.
    required: true
  model-id:
    description: Model ID used by the provider.
    required: false
  api-key:
    description: API or access key used by the selected provider.
    required: false
  secret-key:
    description: Secondary secret used by providers that require a credential pair.
    required: false
  session-token:
    description: Temporary session token used by providers that support one.
    required: false
  base-url:
    description: Custom base URL used by the selected provider.
    required: false
  project:
    description: Cloud project used by the selected provider.
    required: false
  location:
    description: Cloud location used by the selected provider.
    required: false
  region:
    description: Cloud region used by the selected provider.
    required: false
  openai-compatible-streaming:
    description: Force streaming transport for an OpenAI-compatible provider.
    required: false
  openwiki-langsmith-api-key:
    description: LangSmith key used by the code-mode connector.
    required: false
  langsmith-api-key:
    description: LangSmith key used to trace the OpenWiki run.
    required: false
  langchain-project:
    description: LangSmith project used to trace the OpenWiki run.
    required: false
    default: openwiki
  langchain-tracing-v2:
    description: Enable LangSmith tracing for the OpenWiki run.
    required: false
    default: "true"
  token:
    description: Token used to create and update the pull request; defaults to github.token.
    required: false
  create-pull-request:
    description: Open or update a pull request after OpenWiki finishes.
    required: false
    default: "true"
  add-paths:
    description: Newline-separated paths included in the update pull request.
    required: false
    default: |
      openwiki
      AGENTS.md
      CLAUDE.md
  branch:
    description: Branch used for the update pull request.
    required: false
    default: openwiki/update
  commit-message:
    description: Commit message used for OpenWiki updates.
    required: false
    default: "docs: update OpenWiki"
  title:
    description: Title used for the update pull request.
    required: false
    default: "docs: update OpenWiki"
  body:
    description: Body used for the update pull request.
    required: false
    default: |
      Automated OpenWiki documentation update.

      This PR was generated by the OpenWiki action.

outputs:
  pull-request-operation:
    description: The pull request operation performed, if any.
    value: ${{ steps.pull-request.outputs.pull-request-operation }}
  pull-request-number:
    description: The pull request number, if a pull request was created or updated.
    value: ${{ steps.pull-request.outputs.pull-request-number }}
  pull-request-url:
    description: The pull request URL, if a pull request was created or updated.
    value: ${{ steps.pull-request.outputs.pull-request-url }}

runs:
  using: composite
  steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: "22"

    - name: Install OpenWiki
      shell: bash
      env:
        ACTION_PACKAGE_JSON: ${{ github.action_path }}/package.json
      run: |
        version="$(node --input-type=commonjs -e 'process.stdout.write(require(process.env.ACTION_PACKAGE_JSON).version)')"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
          echo "OpenWiki action package version is not valid semver" >&2
          exit 1
        fi
        npm install --global "openwiki@$version" mermaid@11.16.0 jsdom@29.1.1

    - name: Run OpenWiki
      shell: bash
      env:
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL_ID: ${{ inputs.model-id }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_SECRET_KEY: ${{ inputs.secret-key }}
        INPUT_SESSION_TOKEN: ${{ inputs.session-token }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_LOCATION: ${{ inputs.location }}
        INPUT_REGION: ${{ inputs.region }}
        INPUT_OPENAI_COMPATIBLE_STREAMING: ${{ inputs.openai-compatible-streaming }}
        INPUT_OPENWIKI_LANGSMITH_API_KEY: ${{ inputs.openwiki-langsmith-api-key }}
        INPUT_LANGSMITH_API_KEY: ${{ inputs.langsmith-api-key }}
        INPUT_LANGCHAIN_PROJECT: ${{ inputs.langchain-project }}
        INPUT_LANGCHAIN_TRACING_V2: ${{ inputs.langchain-tracing-v2 }}
      run: node "${{ github.action_path }}/scripts/run-action.cjs"

    - name: Create OpenWiki update pull request
      id: pull-request
      if: ${{ inputs.create-pull-request == 'true' }}
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
      with:
        token: ${{ inputs.token || github.token }}
        add-paths: ${{ inputs.add-paths }}
        branch: ${{ inputs.branch }}
        commit-message: ${{ inputs.commit-message }}
        title: ${{ inputs.title }}
        body: ${{ inputs.body }}
