allowBuilds:
  better-sqlite3: true
  esbuild: true
# Force patched versions of transitive dependencies flagged by Dependabot,
# pnpm audit, or Trivy. js-yaml is pulled in only by @changesets/cli (both
# majors coexist, so each keeps its own patched line); fast-uri is pulled
# through @modelcontextprotocol/sdk -> ajv in the published runtime.
#   brace-expansion GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895,
#                   CVE-2026-102277
#   fast-uri CVE-2026-75899, CVE-2026-75931, CVE-2026-75975, CVE-2026-76172,
#            CVE-2026-84292, CVE-2026-84394, CVE-2026-86472
#   hono CVE-2026-93981
#   js-yaml GHSA-5p4m-2wfm-xmqj  (quadratic-CPU DoS in !!omap resolution)
#   katex CVE-2026-103923
#   nanoid GHSA-2v37-7h3g-55p8
#   proxy-addr CVE-2026-90711
#   qs CVE-2026-82417, CVE-2026-82562
#   shell-quote CVE-2026-102422
#   source-map-js CVE-2026-93749
#   undici  GHSA-4cwx-7wf7-3272, -m8rv-5g2x-5cg5, -jr45-8vmc-qm54,
#           -v3r7-h72x-cjcm, -8xcm-r25x-g524, CVE-2026-19534,
#           CVE-2026-84961
overrides:
  brace-expansion: 5.0.12
  fast-uri: 3.1.8
  hono: 4.13.7
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  katex: 0.18.2
  nanoid: 3.3.18
  proxy-addr: 2.0.8
  qs: 6.16.0
  shell-quote: 1.11.0
  source-map-js: 1.2.2
  undici: ^7.29.1
minimumReleaseAgeExclude:
  - "@modelcontextprotocol/sdk@1.31.0"
  - "@langchain/core@1.2.4"
  - "@langchain/openai"
  - "@langchain/openai@1.5.4"
  - "@langchain/openai@1.5.5"
  - "@vitest/coverage-v8@4.1.10"
  - "@vitest/expect@4.1.10"
  - "@vitest/mocker@4.1.10"
  - "@vitest/pretty-format@4.1.10"
  - "@vitest/runner@4.1.10"
  - "@vitest/snapshot@4.1.10"
  - "@vitest/spy@4.1.10"
  - "@vitest/utils@4.1.10"
  - "deepagents@1.12.0"
  - "brace-expansion@5.0.12"
  - "fast-uri@3.1.8"
  - "hono@4.13.7"
  - "katex@0.18.2"
  - "langchain@1.5.3"
  - "nanoid@3.3.18"
  - "node-abi@3.94.0"
  - "picomatch@4.0.5"
  - "qs@6.16.0"
  - "shell-quote@1.11.0"
  - "source-map-js@1.2.2"
  - "undici@7.29.1"
  - "vitest@4.1.10"
# Supply-chain hardening (see https://pnpm.io/supply-chain-security).
#
# Delay installing newly published versions so that a compromised release has
# time to be detected and pulled before it can enter the dependency tree.
# Value is in minutes; 10080 = 1 week.
minimumReleaseAge: 10080
